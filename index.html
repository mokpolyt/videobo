<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUCUB KOLEKSI GREAT</title>
<style>
  :root {
    --tosca: #0b4f4f;
    --blue: #1e63c6;
    --light-blue: #dcebfa;
    --white: #ffffff;
    --amber: #ffb000;
    --amber-dark: #b34700;
    --amber-light: #ffe3b8;
    --amber-cream: #fff6e6;
    --amber-text: #5a2600;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--white);
    min-height: 100vh;
    padding: 28px 20px 90px;
    position: relative;
    overflow-x: hidden;
  }
  /* ---------- background (static) ---------- */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(40% 35% at 20% 25%, rgba(30,99,198,.35), transparent 70%),
      radial-gradient(35% 30% at 80% 20%, rgba(11,150,150,.30), transparent 70%),
      radial-gradient(45% 40% at 70% 85%, rgba(255,176,0,.18), transparent 70%),
      radial-gradient(30% 30% at 10% 90%, rgba(160,60,255,.20), transparent 70%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .7;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 120px, #9cf, transparent),
      radial-gradient(1.5px 1.5px at 160px 70px, #fff, transparent),
      radial-gradient(1px 1px at 230px 180px, #7fe, transparent),
      radial-gradient(1px 1px at 300px 40px, #fff, transparent);
    background-size: 320px 220px;
  }

  /* ---------- title ---------- */
  h1 {
    text-align: center; margin: 10px 0 6px; font-size: clamp(28px, 6vw, 56px);
    letter-spacing: .08em; font-weight: 900;
    background: linear-gradient(90deg, #19d3c5, #3b82f6, #a5d8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status {
    text-align: center; font-size: 13px; color: #9fc3e8; margin-bottom: 26px;
  }

  /* ---------- sections ---------- */
  section { max-width: 1200px; margin: 0 auto 56px; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
  .bar h2 { margin: 0; font-size: 20px; letter-spacing: .06em; }
  #t1 .bar h2 { color: #7fd6ff; }
  #t2 .bar h2 { color: var(--amber); }

  .plus {
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    font-size: 30px; line-height: 1; font-weight: 700; color: #fff;
  }
  #t1 .plus { background: linear-gradient(135deg, var(--blue), #19d3c5); box-shadow: 0 0 18px rgba(30,99,198,.8); }
  #t2 .plus { background: linear-gradient(135deg, var(--amber-dark), var(--amber)); box-shadow: 0 0 18px rgba(255,176,0,.7); }

  /* ---------- topic filter ---------- */
  .filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
  .filter input, .filter select {
    background: #06202a; color: #fff; border: 1.5px solid var(--blue); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; outline: none; min-width: 160px;
  }
  .filter input:focus, .filter select:focus { border-color: #19d3c5; }
  .filter button {
    background: transparent; color: #7fd6ff; border: 1.5px solid var(--blue); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .filter button:hover { background: var(--blue); color: #fff; }
  .filter .count { font-size: 13px; color: #9fc3e8; margin-left: 4px; }
  tbody tr.hidden { display: none; }

  .wrap { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  #t2 table { min-width: 640px; }
  #t1 table { border: 2px solid var(--blue); box-shadow: 0 0 24px rgba(30,99,198,.45); }
  #t2 table { border: 2px solid var(--amber); box-shadow: 0 0 24px rgba(255,176,0,.35); }

  thead th { text-align: left; padding: 12px 14px; color: #fff; }
  #t1 thead th { background: var(--tosca); border-bottom: 3px solid var(--blue); }
  #t2 thead th { background: var(--amber-dark); border-bottom: 3px solid var(--amber); }

  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { text-decoration: underline; filter: brightness(1.25); }
  /* row height follows content: each row may be a different height */
  tbody td { padding: 10px 14px; vertical-align: top; position: relative; min-width: 110px; cursor: pointer; user-select: none; }
  #t1 tbody td { border: 1px solid var(--blue); color: var(--tosca); }
  #t2 tbody td { border: 1px solid var(--amber); color: var(--amber-text); }
  #t1 tbody tr:nth-child(odd) { background: var(--white); }
  #t1 tbody tr:nth-child(even) { background: var(--light-blue); }
  #t2 tbody tr:nth-child(odd) { background: var(--amber-cream); }
  #t2 tbody tr:nth-child(even) { background: var(--amber-light); }
  tbody tr:hover { filter: brightness(.96); }

  .val { display: inline-block; min-width: 40px; outline: none; word-break: break-word; white-space: pre-wrap; }
  .val:empty::before { content: "klik untuk isi…"; opacity: .4; font-style: italic; }
  .go { margin-left: 6px; text-decoration: none; font-weight: 800; color: var(--blue); }
  #t2 .go { color: var(--amber-dark); }

  td.open { cursor: text; user-select: text; outline: 3px dashed #19d3c5; outline-offset: -3px; background: #fffbe0 !important; }

  .badge {
    position: absolute; right: 4px; bottom: 2px; font-size: 11px; font-weight: 800;
    padding: 1px 6px; border-radius: 999px; background: #111; color: #fff;
    opacity: 0; pointer-events: none;
  }
  .badge.show { opacity: .9; }

  .del {
    position: absolute; left: -2px; top: -2px; width: 20px; height: 20px; border: 0; border-radius: 50%;
    background: #e5484d; color: #fff; font-size: 12px; cursor: pointer; opacity: 0; line-height: 20px; padding: 0;
  }
  tr:hover .del { opacity: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 100;
    background: #111; color: #fff; border: 1px solid #3b82f6; padding: 8px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ---------- the ONLY animation: small woman running, bird following ---------- */
  .patrol {
    position: fixed; left: 0; bottom: 6px; width: 100px; height: 58px;
    z-index: 5; pointer-events: none;
    animation: patrol 18s linear infinite;
  }
  @keyframes patrol {
    0%      { transform: translateX(0) scaleX(1); }
    49.99%  { transform: translateX(calc(100vw - 100px)) scaleX(1); }
    50%     { transform: translateX(calc(100vw - 100px)) scaleX(-1); }
    99.99%  { transform: translateX(0) scaleX(-1); }
    100%    { transform: translateX(0) scaleX(1); }
  }
  .woman { position: absolute; left: 62px; bottom: 0; animation: bob .3s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  .leg, .arm, .pony { transform-box: view-box; }
  .leg  { transform-origin: 20px 36px; animation: swing .35s ease-in-out infinite alternate; }
  .arm  { transform-origin: 20px 17px; animation: swingArm .35s ease-in-out infinite alternate; }
  .pony { transform-origin: 18px 6px;  animation: pony .35s ease-in-out infinite alternate; }
  .legA { animation-delay: 0s; }
  .legB { animation-delay: -.35s; }
  .armA { animation-delay: -.35s; }
  .armB { animation-delay: 0s; }
  @keyframes swing    { from { transform: rotate(-42deg); } to { transform: rotate(42deg); } }
  @keyframes swingArm { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
  @keyframes pony     { from { transform: rotate(-8deg); }  to { transform: rotate(10deg); } }

  .bird { position: absolute; left: 20px; top: 0; animation: glide 1.1s ease-in-out infinite alternate; }
  @keyframes glide { from { transform: translateY(-3px); } to { transform: translateY(5px); } }
  .wing { transform-box: view-box; transform-origin: 15px 12px; animation: flap .22s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
</style>
</head>
<body>

<h1 id="title">YUCUB KOLEKSI GREAT</h1>
<div class="status" id="status">Memuat…</div>

<section id="t1">
  <div class="bar"><h2>📺 KOLEKSI</h2><button class="plus" title="Tambah baris" aria-label="Tambah baris">+</button></div>
  <div class="filter">
    <input type="search" id="fText" placeholder="🔎 Cari topic…" list="topicList" autocomplete="off" aria-label="Cari topic">
    <datalist id="topicList"></datalist>
    <select id="fSelect" aria-label="Filter topic"><option value="">Semua topic</option></select>
    <button type="button" id="fReset">Reset</button>
    <span class="count" id="fCount"></span>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>Title</th><th>URL</th><th class="sortable" title="Klik untuk urutkan A–Z">Topic ▲</th><th>Summary</th><th>Transcript</th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>

<section id="t2">
  <div class="bar"><h2>💡 INSPIRASI</h2><button class="plus" title="Tambah baris" aria-label="Tambah baris">+</button></div>
  <div class="wrap"><table>
    <thead><tr><th>Inspirasi Judul</th><th>Summary</th><th>Keterangan dan URL</th></tr></thead>
    <tbody></tbody>
  </table></div>
</section>

<!-- woman running left <-> right, bird following -->
<div class="patrol" aria-hidden="true">
  <svg class="bird" viewBox="0 0 34 24" width="30" height="21">
    <polygon points="8,12 1,8 2,16" fill="#1e63c6"/>
    <ellipse cx="16" cy="13" rx="9" ry="5" fill="#3b82f6"/>
    <circle cx="26" cy="10" r="4" fill="#3b82f6"/>
    <polygon points="29.5,9 34,10.5 29.5,12" fill="#ffb000"/>
    <circle cx="27" cy="9" r="0.9" fill="#111"/>
    <path class="wing" d="M14 12 Q9 1 20 3 Q19 9 18 12 Z" fill="#9cc4ff"/>
  </svg>
  <svg class="woman" viewBox="0 0 40 64" width="30" height="48">
    <g transform="rotate(8 20 32)">
      <path class="pony" d="M18 6 Q7 7 8 19" stroke="#6b3a1e" fill="none" stroke-width="3.2" stroke-linecap="round"/>
      <line class="arm armA" x1="20" y1="17" x2="20" y2="30" stroke="#e9b98f" stroke-width="3" stroke-linecap="round"/>
      <line class="leg legA" x1="20" y1="36" x2="20" y2="57" stroke="#e9b98f" stroke-width="4" stroke-linecap="round"/>
      <path d="M15 14 L25 14 L26 27 L14 27 Z" fill="#e8467c"/>
      <path d="M14 27 L26 27 L28 37 L12 37 Z" fill="#2b3a67"/>
      <circle cx="21" cy="8" r="5.5" fill="#f1c7a0"/>
      <path d="M15.3 8 Q15.5 1.5 22 2.4 Q27.5 3.4 26.6 8.5 Q22 5.2 15.3 8 Z" fill="#6b3a1e"/>
      <line class="leg legB" x1="20" y1="36" x2="20" y2="57" stroke="#f1c7a0" stroke-width="4" stroke-linecap="round"/>
      <line class="arm armB" x1="20" y1="17" x2="20" y2="30" stroke="#f1c7a0" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========== SUPABASE CONFIG: isi dua nilai ini (Project Settings → API) ========== */
const SUPABASE_URL = "https://gjyeknwtoofpuvoaftfj.supabase.co";       // contoh: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_HBf14rn-fWP8AZ_OaLFfag_V6qNKjk5";  // anon public key
/* ================================================================================ */

const CLICKS_NEEDED = 12;

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const TABLES = [
  { id: "t1", name: "koleksi",   store: "yucub_koleksi",   cols: ["title", "url", "topic", "summary", "transcript"], urlCol: "url" },
  { id: "t2", name: "inspirasi", store: "yucub_inspirasi", cols: ["judul", "summary", "keterangan_url"], urlCol: null }
];

const statusEl = document.getElementById("status");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const blank = t => { const r = { id: uid() }; t.cols.forEach(c => r[c] = ""); return r; };

function setHref(a, v) {
  v = (v || "").trim();
  if (!v) { a.removeAttribute("href"); a.style.display = "none"; return; }
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  a.href = v; a.style.display = "";
}

let toastEl, toastTimer;
function toast(msg) {
  if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

async function persist(t, row, isNew) {
  if (t.remote) {
    const q = isNew ? sb.from(t.name).insert(row) : sb.from(t.name).update(row).eq("id", row.id);
    const { error } = await q;
    if (error) { statusEl.textContent = "⚠️ Gagal simpan ke Supabase: " + error.message; toast("⚠️ Gagal simpan"); }
    else toast("✅ Tersimpan ke Supabase");
  } else {
    try { localStorage.setItem(t.store, JSON.stringify(t.rows)); toast("✅ Tersimpan di browser"); }
    catch (e) {
      statusEl.textContent = "🔴 Tidak bisa menyimpan: penyimpanan browser diblokir di sini. Buka file ini langsung di browser (atau lewat GitHub Pages) dan isi Supabase.";
      toast("⚠️ Tidak tersimpan");
    }
  }
}

/* ========== TOPIC FILTER (koleksi) ========== */
function applyFilter() {
  const t = TABLES[0];
  if (!t.tbody) return;
  const txt = document.getElementById("fText").value.trim().toLowerCase();
  const sel = document.getElementById("fSelect").value;
  let shown = 0;
  t.rows.forEach((r, i) => {
    const tr = t.tbody.children[i];
    if (!tr) return;
    const topic = (r.topic || "").trim();
    const ok = (!sel || topic === sel) && (!txt || topic.toLowerCase().includes(txt));
    tr.classList.toggle("hidden", !ok);
    if (ok) shown++;
  });
  document.getElementById("fCount").textContent = shown + " / " + t.rows.length + " baris";
}
function refreshTopics() {
  const t = TABLES[0];
  const topics = [...new Set(t.rows.map(r => (r.topic || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
  const sel = document.getElementById("fSelect");
  const keep = sel.value;
  sel.innerHTML = '<option value="">Semua topic</option>';
  topics.forEach(x => { const o = document.createElement("option"); o.value = x; o.textContent = x; sel.appendChild(o); });
  sel.value = topics.includes(keep) ? keep : "";
  const dl = document.getElementById("topicList");
  dl.innerHTML = "";
  topics.forEach(x => { const o = document.createElement("option"); o.value = x; dl.appendChild(o); });
}
function refreshFilter() { refreshTopics(); applyFilter(); }
document.getElementById("fText").addEventListener("input", applyFilter);
document.getElementById("fSelect").addEventListener("change", () => { document.getElementById("fText").value = ""; applyFilter(); });
document.getElementById("fReset").addEventListener("click", () => {
  document.getElementById("fText").value = ""; document.getElementById("fSelect").value = ""; applyFilter();
});

function makeCell(t, row, col) {
  const td = document.createElement("td");
  const val = document.createElement("span");
  val.className = "val";
  val.textContent = row[col] || "";
  td.appendChild(val);

  let link = null;
  if (col === t.urlCol) {
    link = document.createElement("a");
    link.className = "go"; link.textContent = "↗"; link.target = "_blank"; link.rel = "noopener";
    setHref(link, row[col]);
    td.appendChild(link);
  }
  const badge = document.createElement("span");
  badge.className = "badge";
  td.appendChild(badge);

  let n = 0;
  const unlock = () => {
    td.classList.add("open");
    val.contentEditable = "true";
    badge.textContent = "✏️ edit!";
    badge.classList.add("show");
    val.focus();
    const r = document.createRange(); r.selectNodeContents(val); r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  td.addEventListener("click", e => {
    if (e.target.closest("a.go") || td.classList.contains("open")) return;
    // empty field: edit straight away
    if (!val.textContent.trim()) { unlock(); return; }
    // existing value: needs 12 clicks
    n++;
    badge.textContent = n + "/" + CLICKS_NEEDED;
    badge.classList.add("show");
    if (n >= CLICKS_NEEDED) unlock();
  });

  val.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); val.blur(); }
  });
  val.addEventListener("blur", () => {
    if (!td.classList.contains("open")) return;
    val.contentEditable = "false";
    td.classList.remove("open");
    n = 0; badge.classList.remove("show");
    row[col] = val.textContent.trim();
    if (link) setHref(link, row[col]);
    persist(t, row, false);
    if (t.id === "t1" && col === "topic") refreshFilter();
  });
  let timer;
  val.addEventListener("input", () => {
    row[col] = val.textContent.trim();
    if (link) setHref(link, row[col]);
    clearTimeout(timer);
    timer = setTimeout(() => persist(t, row, false), 500);
  });
  return td;
}

function renderRow(t, row) {
  const tr = document.createElement("tr");
  t.cols.forEach((c, i) => {
    const td = makeCell(t, row, c);
    if (i === 0) {
      const d = document.createElement("button");
      d.className = "del"; d.textContent = "✕"; d.title = "Hapus baris";
      d.addEventListener("click", async e => {
        e.stopPropagation();
        if (!confirm("Hapus baris ini?")) return;
        t.rows = t.rows.filter(r => r.id !== row.id);
        tr.remove();
        if (t.id === "t1") refreshFilter();
        if (t.remote) await sb.from(t.name).delete().eq("id", row.id);
        else persist(t, row, false);
      });
      td.appendChild(d);
    }
    tr.appendChild(td);
  });
  t.tbody.appendChild(tr);
}

async function init(t) {
  const root = document.getElementById(t.id);
  t.tbody = root.querySelector("tbody");
  t.rows = null; t.remote = false;

  if (sb) {
    const { data, error } = await sb.from(t.name).select("*").order("created_at");
    if (error) statusEl.textContent = "⚠️ Supabase error (" + t.name + "): " + error.message;
    else { t.rows = data; t.remote = true; }
  }
  if (!t.rows) {
    try { t.rows = JSON.parse(localStorage.getItem(t.store)); } catch (e) {}
    if (!Array.isArray(t.rows)) t.rows = [blank(t)];
  }
  t.rows.forEach(r => renderRow(t, r));

  root.querySelector(".plus").addEventListener("click", () => {
    const row = blank(t);
    t.rows.push(row);
    renderRow(t, row);
    persist(t, row, true);
    if (t.id === "t1") refreshFilter();
  });

  const th = root.querySelector("th.sortable");
  if (th) th.addEventListener("click", () => {
    const key = x => (x.topic || "").trim();
    t.rows.sort((a, b) => {
      const x = key(a), y = key(b);
      if (!x && !y) return 0;
      if (!x) return 1;   // empty topics go last
      if (!y) return -1;
      return x.localeCompare(y, undefined, { sensitivity: "base", numeric: true });
    });
    t.tbody.innerHTML = "";
    t.rows.forEach(r => renderRow(t, r));
    applyFilter();
    if (!t.remote) { try { localStorage.setItem(t.store, JSON.stringify(t.rows)); } catch (e) {} }
    toast("🔤 Diurutkan A → Z");
  });
}

(async () => {
  for (const t of TABLES) await init(t);
  refreshFilter();
  if (!statusEl.textContent.startsWith("⚠️")) {
    statusEl.textContent = TABLES.every(t => t.remote)
      ? "🟢 Terhubung ke Supabase"
      : "🟡 Mode lokal (tersimpan di browser). Isi SUPABASE_URL dan SUPABASE_ANON_KEY untuk pakai Supabase.";
  }
})();
</script>
</body>
</html>
